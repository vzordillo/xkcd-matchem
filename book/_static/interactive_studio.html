  function stopPlayback() {
    if (playTimer !== null) {
      clearInterval(playTimer);
      playTimer = null;
    }
    state.playing = false;
    document.getElementById("xm-traj-play").textContent = "Play";
  }

  function applyTrajectoryFrame(idx) {
    const frames = currentSample.frames;
    if (!frames || !frames.length) return;
    const n = frames.length;
    const fIdx = ((idx % n) + n) % n;
    state.frameIdx = fIdx;
    const fr = frames[fIdx];
    baseData.positions = fr.positions.map((p) => p.slice());
    if (fr.cell) baseData.cell = fr.cell.map((r) => r.slice());
    if (fr.bonds) baseData.bonds = fr.bonds;
    if (fr.vectors) baseData.vectors = fr.vectors;
    document.getElementById("xm-traj-slider").value = String(fIdx);
    const eStr = fr.energy !== undefined ? ` | E=${Number(fr.energy).toFixed(3)} eV` : "";
    document.getElementById("xm-traj-readout").textContent = `Frame ${fIdx + 1} / ${n}${eStr}`;
    renderFrame();
  }

  function syncTrajectoryControls() {
    stopPlayback();
    const grp = document.getElementById("xm-traj-group");
    const frames = currentSample.frames;
    if (frames && frames.length > 1) {
      grp.style.display = "block";
      const slider = document.getElementById("xm-traj-slider");
      slider.max = String(frames.length - 1);
      slider.value = "0";
      applyTrajectoryFrame(0);
    } else {
      grp.style.display = "none";
    }
  }

  document.getElementById("xm-traj-slider").addEventListener("input", (e) => {
    stopPlayback();
    applyTrajectoryFrame(parseInt(e.target.value, 10) || 0);
  });
  document.getElementById("xm-traj-play").addEventListener("click", () => {
    const frames = currentSample.frames;
    if (!frames || frames.length <= 1) return;
    if (state.playing) { stopPlayback(); return; }
    state.playing = true;
    document.getElementById("xm-traj-play").textContent = "Pause";
    playTimer = setInterval(() => {
      applyTrajectoryFrame(state.frameIdx + 1);
    }, Math.max(40, Math.round(1000 / Math.max(state.fps, 1))));
  });
  document.getElementById("xm-traj-fps").addEventListener("change", (e) => {
    state.fps = parseInt(e.target.value, 10) || 8;
    if (state.playing) {
      stopPlayback();
      document.getElementById("xm-traj-play").click();
    }
  });
  document.getElementById("xm-persp").addEventListener("input", (e) => {
    state.perspective = parseFloat(e.target.value);
    document.getElementById("xm-persp-val").textContent = state.perspective.toFixed(2);
    renderFrame();
  });
  document.getElementById("xm-zoom").addEventListener("input", (e) => {
    state.zoom = parseFloat(e.target.value);
    document.getElementById("xm-zoom-val").textContent = state.zoom.toFixed(2);
    renderFrame();
  });
  document.getElementById("xm-scale").addEventListener("input", (e) => {
    state.scale = parseFloat(e.target.value);
    document.getElementById("xm-scale-val").textContent = state.scale.toFixed(2);
    renderFrame();
  });
  document.getElementById("xm-wiggle").addEventListener("input", (e) => {
    state.wiggle = parseFloat(e.target.value);
    document.getElementById("xm-wiggle-val").textContent = state.wiggle.toFixed(1);
    renderFrame();
  });
  ["xm-na", "xm-nb", "xm-nc"].forEach((id, idx) => {
    document.getElementById(id).addEventListener("change", (e) => {
      state.supercell[idx] = Math.max(1, Math.min(3, parseInt(e.target.value, 10) || 1));
      renderFrame();
    });
  });

  function syncControlInputs() {
    document.getElementById("xm-style").value = state.style;
    document.getElementById("xm-palette").value = state.palette;
    document.getElementById("xm-bg-color").value = state.background;
    document.getElementById("xm-cell-mode").value = state.cellMode;
    document.getElementById("xm-axes-mode").value = state.axesMode;
    document.getElementById("xm-show-iso").checked = state.showIso;
    document.getElementById("xm-persp").value = state.perspective;
    document.getElementById("xm-persp-val").textContent = state.perspective.toFixed(2);
    document.getElementById("xm-zoom").value = state.zoom;
    document.getElementById("xm-zoom-val").textContent = state.zoom.toFixed(2);
    document.getElementById("xm-scale").value = state.scale;
    document.getElementById("xm-scale-val").textContent = state.scale.toFixed(2);
    document.getElementById("xm-na").value = state.supercell[0];
    document.getElementById("xm-nb").value = state.supercell[1];
    document.getElementById("xm-nc").value = state.supercell[2];
    syncBackgroundButtons();
    syncIsoShadeUI();
  }

  function applySampleState(smp, isUpload) {
    currentSample = smp;
    baseData = cloneStruct(smp);
    const cam = smp.camera || {};
    state.azimuth = cam.azimuth ?? -118;
    state.elevation = cam.elevation ?? 24;
    state.roll = cam.roll ?? 0;
    state.perspective = cam.perspective ?? 0;
    state.zoom = cam.zoom ?? 1.0;
    state.supercell = [1, 1, 1];
    state.customColors = Object.assign({}, smp.custom_colors || {});
    if (smp.style) {
      state.style = smp.style;
    } else if (isUpload && !smp.cell && state.style === "polyhedra") {
      state.style = "ball_and_stick";
    }
    if (smp.palette_name) state.palette = smp.palette_name;
    if (smp.show_cell !== undefined) {
      state.cellMode = resolveInitialCellMode(smp.show_cell);
      state.axesMode = resolveInitialAxesMode(smp.show_cell);
    }
    if (smp.isosurfaces && smp.isosurfaces.length) {
      state.showIso = true;
    }
    state.isoShade = smp.iso_shade || "solid";
    document.querySelectorAll("#xm-view-buttons .xm-btn").forEach((b) => {
      b.classList.remove("active");
    });
    syncControlInputs();
    syncTrajectoryControls();
    renderFrame();
  }

  document.getElementById("xm-reset-view").addEventListener("click", () => {
    const cam = currentSample.camera || {};
    state.azimuth = cam.azimuth ?? -118;
    state.elevation = cam.elevation ?? 24;
    state.roll = cam.roll ?? 0;
    state.perspective = cam.perspective ?? 0;
    state.zoom = cam.zoom ?? 1.0;
    document.querySelectorAll("#xm-view-buttons .xm-btn").forEach((b) => {
      b.classList.remove("active");
    });
    syncControlInputs();
    renderFrame();
  });

  window.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    if (e.key === "r" || e.key === "R") {
      document.getElementById("xm-reset-view").click();
    } else if (e.key === " " && currentSample.frames && currentSample.frames.length > 1) {
      e.preventDefault();
      document.getElementById("xm-traj-play").click();
    }
  });

  function sceneChipLabel(smp, idx) {
    const raw = (typeof smp.short_name === "string" && smp.short_name.trim())
      ? smp.short_name.trim()
      : String(smp.name || `Sample ${idx + 1}`).trim();
    const cleaned = raw.replace(/\s+\([^()]*\.[a-zA-Z0-9]{2,8}\)$/, "").trim();
    return cleaned || raw || `Sample ${idx + 1}`;
  }

  function sceneCategoryColor(smp) {
    const cat = typeof smp.category === "string" ? smp.category.toLowerCase() : "";
    if (cat.includes("orbital") || cat.includes("iso") || (smp.isosurfaces && smp.isosurfaces.length)) {
      return "#0072B2";
    }
    if (cat.includes("reaction") || cat.includes("md") || cat.includes("traj") || (smp.frames && smp.frames.length > 1)) {
      return "#D55E00";
    }
    if (cat.includes("bio")) return "#E69F00";
    if (cat.includes("crystal") || cat.includes("slab") || cat.includes("poly") || smp.cell) {
      return "#009E73";
    }
    if (cat.includes("mol")) return "#CC79A7";
    return "#64748b";
  }

  function syncSceneChips(activeIdx) {
    document.querySelectorAll("#xm-scene-chips .xm-scene-chip").forEach((chip) => {
      const isAct = Number(chip.dataset.sampleIndex) === activeIdx;
      chip.classList.toggle("active", isAct);
      chip.setAttribute("aria-pressed", isAct ? "true" : "false");
    });
  }

  function selectSampleByIndex(idx) {
    if (!Number.isInteger(idx) || idx < 0 || idx >= samples.length) return;
    const sel = document.getElementById("xm-sample-select");
    if (sel && sel.value !== String(idx)) sel.value = String(idx);
    syncSceneChips(idx);
    applySampleState(samples[idx], false);
  }

  if (samples.length > 1) {
    const grp = document.getElementById("xm-sample-group");
    const sel = document.getElementById("xm-sample-select");
    const sceneBar = document.getElementById("xm-scene-bar");
    const chipWrap = document.getElementById("xm-scene-chips");
    grp.style.display = "block";
    if (sceneBar) sceneBar.style.display = "flex";
    if (chipWrap) chipWrap.textContent = "";
    samples.forEach((smp, i) => {
      const opt = document.createElement("option");
      opt.value = String(i);
      const optCat = typeof smp.category === "string" && smp.category.trim()
        ? `[${smp.category.trim()}] `
        : "";
      opt.textContent = `${optCat}${smp.name || `Sample ${i + 1}`}`;
      sel.appendChild(opt);

      if (chipWrap) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "xm-scene-chip";
        chip.dataset.sampleIndex = String(i);
        chip.setAttribute("aria-pressed", i === 0 ? "true" : "false");
        const tipParts = [smp.name || `Sample ${i + 1}`];
        if (typeof smp.category === "string" && smp.category.trim()) {
          tipParts.push(smp.category.trim());
        }
        if (typeof smp.description === "string" && smp.description.trim()) {
          tipParts.push(smp.description.trim());
        }
        chip.title = tipParts.join(" — ");

        const dot = document.createElement("span");
        dot.className = "xm-scene-dot";
        dot.style.background = sceneCategoryColor(smp);
        dot.setAttribute("aria-hidden", "true");
        const labelSpan = document.createElement("span");
        labelSpan.textContent = sceneChipLabel(smp, i);

        chip.appendChild(dot);
        chip.appendChild(labelSpan);
        chip.addEventListener("click", () => selectSampleByIndex(i));
        chipWrap.appendChild(chip);
      }
    });
    sel.value = "0";
    syncSceneChips(0);
    sel.addEventListener("change", (e) => {
      selectSampleByIndex(parseInt(e.target.value, 10));
    });
  }

  document.getElementById("xm-file-input").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const txt = await file.text();
      syncSceneChips(-1);
      const sel = document.getElementById("xm-sample-select");
      if (sel) sel.selectedIndex = -1;
      applySampleState(parseUploadedFile(file.name, txt), true);
      document.getElementById("xm-status").textContent = `Loaded ${file.name}`;
    } catch (err) {
      document.getElementById("xm-status").textContent = err.message;
    }
  });

  document.getElementById("xm-copy-py").addEventListener("click", async () => {
    const code = buildPythonSnippet();
    if (navigator.clipboard) await navigator.clipboard.writeText(code);
    document.getElementById("xm-status").textContent = "Copied Python snippet!";
    setTimeout(() => (document.getElementById("xm-status").textContent = ""), 2200);
  });

  document.getElementById("xm-dl-png").addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = `${(currentSample.name || "structure").replace(/[^a-zA-Z0-9_-]/g, "_")}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  });

  document.getElementById("xm-dl-svg").addEventListener("click", () => {
    const blob = new Blob([exportSVGString()], { type: "image/svg+xml" });
    const link = document.createElement("a");
    link.download = `${(currentSample.name || "structure").replace(/[^a-zA-Z0-9_-]/g, "_")}.svg`;
    link.href = URL.createObjectURL(blob);
    link.click();
  });

  window.addEventListener("resize", renderFrame);
  syncTrajectoryControls();
  renderFrame();
})();
</script>
</body>
</html>
