:root {
  --ui-bg: #f7f8fb;
  --ui-card: #ffffff;
  --ui-border: #d5dae4;
  --ui-ink: #16181d;
  --ui-muted: #586070;
  --ui-accent: #1d4ed8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "xkcd Script", system-ui, -apple-system, sans-serif;
  background: var(--ui-bg);
  color: var(--ui-ink);
}
.xm-shell {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 305px;
  gap: 12px;
  padding: 12px;
  min-height: 640px;
}
@media (max-width: 900px) {
  .xm-shell { grid-template-columns: 1fr; }
}
.xm-stage-card {
  background: var(--ui-card);
  border: 1px solid var(--ui-border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 540px;
}
.xm-topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--ui-border);
  background: #fbfcfe;
}
.xm-title {
  font-size: 1.25rem;
  font-weight: 700;
  margin: 0;
}
.xm-subtitle {
  font-size: 0.92rem;
  color: var(--ui-muted);
}
.xm-preset-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.xm-btn {
  font-family: inherit;
  font-size: 0.92rem;
  padding: 4px 9px;
  border-radius: 7px;
  border: 1px solid var(--ui-border);
  background: #ffffff;
  color: var(--ui-ink);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.xm-btn:hover { background: #eef2ff; border-color: #93c5fd; }
.xm-btn.active {
  background: #1d4ed8;
  color: #ffffff;
  border-color: #1d4ed8;
}
.xm-canvas-wrap {
  position: relative;
  flex: 1;
  min-height: 440px;
  display: flex;
  align-items: stretch;
}
canvas#xm-canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
}
canvas#xm-canvas:active { cursor: grabbing; }
.xm-hint {
  position: absolute;
  left: 10px;
  bottom: 8px;
  font-size: 0.85rem;
  padding: 2px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.78);
  color: #374151;
  pointer-events: none;
}
.xm-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 12px;
  border-top: 1px solid var(--ui-border);
  background: #fbfcfe;
  align-items: center;
}
.xm-status {
  margin-left: auto;
  font-size: 0.9rem;
  color: var(--ui-accent);
}
.xm-panel {
  background: var(--ui-card);
  border: 1px solid var(--ui-border);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 11px;
  overflow-y: auto;
  max-height: 760px;
}
.xm-group {
  border-bottom: 1px dashed #e2e6ef;
  padding-bottom: 9px;
}
.xm-group:last-child { border-bottom: none; padding-bottom: 0; }
.xm-group-title {
  font-size: 1.02rem;
  font-weight: 700;
  margin-bottom: 6px;
}
.xm-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 5px;
  font-size: 0.94rem;
}
.xm-row select,
.xm-row input[type="number"] {
  font-family: inherit;
  font-size: 0.92rem;
  padding: 3px 6px;
  border: 1px solid var(--ui-border);
  border-radius: 6px;
  background: #ffffff;
}
.xm-row input[type="range"] { flex: 1; max-width: 155px; }
.xm-supercell {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.xm-supercell label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.9rem;
  border: 1px solid var(--ui-border);
  border-radius: 6px;
  padding: 3px 6px;
}
.xm-supercell input {
  width: 42px;
  border: none;
  font-family: inherit;
  font-size: 0.95rem;
  text-align: center;
}
.xm-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.xm-swatch {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 7px;
  border: 1px solid var(--ui-border);
  border-radius: 999px;
  background: #ffffff;
  font-size: 0.9rem;
}
.xm-swatch input[type="color"] {
  width: 22px;
  height: 22px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
}
.xm-codebox {
  width: 100%;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.74rem;
  padding: 6px;
  border-radius: 6px;
  border: 1px solid var(--ui-border);
  background: #f8fafc;
  resize: vertical;
  min-height: 76px;
}
</style>
</head>
<body>
<div class="xm-shell">
  <div class="xm-stage-card">
    <div class="xm-topbar">
      <div>
        <div class="xm-title" id="xm-struct-title">xkcd-matchem 3D Studio</div>
        <div class="xm-subtitle" id="xm-struct-meta">Interactive structure sandbox</div>
      </div>
      <div class="xm-preset-row" id="xm-view-buttons">
        <button class="xm-btn" data-view="isometric">Iso</button>
        <button class="xm-btn" data-view="perspective">Persp</button>
        <button class="xm-btn" data-view="front">Front</button>
        <button class="xm-btn" data-view="side">Side</button>
        <button class="xm-btn" data-view="top">Top</button>
        <button class="xm-btn" data-view="a">a</button>
        <button class="xm-btn" data-view="b">b</button>
        <button class="xm-btn" data-view="c">c</button>
        <button class="xm-btn" data-view="a*">a*</button>
        <button class="xm-btn" data-view="b*">b*</button>
        <button class="xm-btn" data-view="c*">c*</button>
      </div>
    </div>
    <div class="xm-canvas-wrap">
      <canvas id="xm-canvas"></canvas>
      <div class="xm-hint" id="xm-camera-readout">
        Drag: orbit | Shift+Drag: roll | Wheel: zoom
      </div>
    </div>
    <div class="xm-actions">
      <button class="xm-btn" id="xm-copy-py">Copy Python</button>
      <button class="xm-btn" id="xm-dl-png">Download PNG</button>
      <button class="xm-btn" id="xm-dl-svg">Download SVG</button>
      <label class="xm-btn" for="xm-file-input">Open Structure File</label>
      <input id="xm-file-input" type="file" accept=".xyz,.poscar,.vasp,.cif,.pdb,.sdf,.mol" style="display:none" />
      <span class="xm-status" id="xm-status"></span>
    </div>
  </div>

  <div class="xm-panel">
    <div class="xm-group" id="xm-sample-group" style="display:none;">
      <div class="xm-group-title">Bundled Samples</div>
      <div class="xm-row">
        <label for="xm-sample-select">Structure</label>
        <select id="xm-sample-select"></select>
      </div>
    </div>

    <div class="xm-group" id="xm-traj-group" style="display:none;">
      <div class="xm-group-title">Trajectory Playback</div>
      <div class="xm-row">
        <button class="xm-btn" id="xm-traj-play">Play</button>
        <input id="xm-traj-slider" type="range" min="0" max="0" step="1" value="0" />
        <select id="xm-traj-fps" style="width:74px;">
          <option value="4">4 fps</option>
          <option value="8" selected>8 fps</option>
          <option value="16">16 fps</option>
        </select>
      </div>
      <div class="xm-row">
        <span id="xm-traj-readout" class="xm-status">Frame 1 / 1</span>
      </div>
    </div>

    <div class="xm-group">
      <div class="xm-group-title">Appearance</div>
      <div class="xm-row">
        <label for="xm-style">Style</label>
        <select id="xm-style">
          <option value="ball_and_stick">ball_and_stick</option>
          <option value="spacefill">spacefill</option>
          <option value="stick">stick</option>
          <option value="polyhedra">polyhedra</option>
        </select>
      </div>
      <div class="xm-row">
        <label for="xm-palette">Element Palette</label>
        <select id="xm-palette">
          <option value="xkcd">xkcd</option>
          <option value="jmol">jmol</option>
          <option value="pastel">pastel</option>
          <option value="colorblind">colorblind</option>
        </select>
      </div>
      <div class="xm-row">
        <label>Background</label>
        <div style="display:flex;gap:4px;align-items:center;">
          <button class="xm-btn" data-bg="#FFFFFF" title="Pure white">White</button>
          <button class="xm-btn" data-bg="#FAF6EE" title="Warm paper">Paper</button>
          <button class="xm-btn" data-bg="#181A1F" title="Chalkboard">Chalk</button>
          <input type="color" id="xm-bg-color" value="#ffffff" />
        </div>
      </div>
      <div class="xm-row">
        <label for="xm-cell-mode">Cell Box</label>
        <select id="xm-cell-mode">
          <option value="box">Base + Edges</option>
          <option value="wireframe">Wireframe</option>
          <option value="off">Hidden</option>
        </select>
      </div>
      <div class="xm-row">
        <label for="xm-axes-mode">Crystal Axes</label>
        <select id="xm-axes-mode">
          <option value="corner">Corner Triad</option>
          <option value="edges">Box Edges</option>
          <option value="origin">Origin Tripod</option>
          <option value="off">Hidden</option>
        </select>
      </div>
      <div class="xm-row">
        <label><input type="checkbox" id="xm-show-bonds" checked /> Bonds</label>
        <label><input type="checkbox" id="xm-boundary-atoms" checked /> Boundary</label>
        <label><input type="checkbox" id="xm-center-cell" /> Center</label>
        <label><input type="checkbox" id="xm-legend" checked /> Legend</label>
        <label><input type="checkbox" id="xm-show-vectors" checked /> Vectors</label>
        <label><input type="checkbox" id="xm-show-iso" checked /> Isosurface</label>
      </div>
      <div class="xm-row">
        <label for="xm-iso-shade">Iso Shading</label>
        <select id="xm-iso-shade">
          <option value="crosshatch">Cross-Hatching</option>
          <option value="hatch">Hatching</option>
          <option value="contour">Contour Shading</option>
          <option value="cross_contour">3D Cross-Contour</option>
          <option value="stipple">Stippling</option>
          <option value="scumble">Scumbling / Scribble</option>
          <option value="solid">Smooth Blending</option>
          <option value="outline">Outline Only</option>
        </select>
      </div>
    </div>

    <div class="xm-group">
      <div class="xm-group-title">Camera &amp; Wiggle</div>
      <div class="xm-row">
        <label for="xm-persp">Perspective</label>
        <input id="xm-persp" type="range" min="0" max="1.2" step="0.05" value="0" />
        <span id="xm-persp-val">0.00</span>
      </div>
      <div class="xm-row">
        <label for="xm-zoom">Zoom</label>
        <input id="xm-zoom" type="range" min="0.5" max="2.2" step="0.05" value="1.0" />
        <span id="xm-zoom-val">1.00</span>
      </div>
      <div class="xm-row">
        <label for="xm-scale">Atom Scale</label>
        <input id="xm-scale" type="range" min="0.6" max="1.6" step="0.05" value="1.0" />
        <span id="xm-scale-val">1.00</span>
      </div>
      <div class="xm-row">
        <label for="xm-wiggle">xkcd Wiggle</label>
        <input id="xm-wiggle" type="range" min="0" max="2.5" step="0.1" value="0.9" />
        <span id="xm-wiggle-val">0.9</span>
      </div>
    </div>

    <div class="xm-group" id="xm-supercell-group">
      <div class="xm-group-title">Supercell</div>
      <div class="xm-supercell">
        <label>na <input id="xm-na" type="number" min="1" max="3" value="1" /></label>
        <label>nb <input id="xm-nb" type="number" min="1" max="3" value="1" /></label>
        <label>nc <input id="xm-nc" type="number" min="1" max="3" value="1" /></label>
      </div>
    </div>

    <div class="xm-group">
      <div class="xm-group-title">Custom Element Colors</div>
      <div class="xm-swatches" id="xm-swatches"></div>
    </div>

    <div class="xm-group">
      <div class="xm-group-title">Reproducible Python Snippet</div>
      <textarea class="xm-codebox" id="xm-py-preview" readonly></textarea>
    </div>
  </div>
</div>
