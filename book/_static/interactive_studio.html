:root {
  --ui-bg: #f7f8fb;
  --ui-card: #ffffff;
  --ui-border: #d5dae4;
  --ui-ink: #16181d;
  --ui-muted: #586070;
  --ui-accent: #1d4ed8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Patrick Hand", system-ui, -apple-system, sans-serif;
  background: var(--ui-bg);
  color: var(--ui-ink);
}
.xm-shell {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 305px;
  gap: 12px;
  padding: 12px;
  min-height: 640px;
}
@media (max-width: 900px) {
  .xm-shell { grid-template-columns: 1fr; }
}
.xm-stage-card {
  background: var(--ui-card);
  border: 1px solid var(--ui-border);
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(22, 24, 29, 0.04);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 540px;
}
.xm-topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--ui-border);
  background: #fbfcfe;
}
.xm-title-block {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.xm-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.xm-title {
  font-size: 1.25rem;
  font-weight: 700;
  margin: 0;
}
.xm-cat-badge {
  display: inline-flex;
  align-items: center;
  font-size: 0.76rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: #eef2ff;
  color: #1e40af;
  border: 1px solid #c7d2fe;
  letter-spacing: 0.01em;
}
.xm-subtitle {
  font-size: 0.92rem;
  color: var(--ui-muted);
}
.xm-desc {
  font-size: 0.84rem;
  color: #4b5563;
  line-height: 1.3;
  margin-top: 1px;
}
.xm-scene-bar,
.xm-iso-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--ui-border);
  background: #f8fafd;
}
.xm-iso-bar {
  background: #fdfcf8;
  padding: 6px 12px;
}
.xm-scene-label {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ui-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-right: 2px;
  white-space: nowrap;
}
.xm-scene-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
  flex: 1;
  min-width: 0;
}
.xm-scene-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: inherit;
  font-size: 0.84rem;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--ui-border);
  background: #ffffff;
  color: var(--ui-ink);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, color 0.12s, box-shadow 0.12s;
}
.xm-scene-chip:hover {
  background: #eef2ff;
  border-color: #93c5fd;
}
.xm-scene-chip:focus-visible {
  outline: 2px solid var(--ui-accent);
  outline-offset: 1px;
}
.xm-scene-chip.active {
  background: var(--ui-accent);
  color: #ffffff;
  border-color: var(--ui-accent);
  box-shadow: 0 1px 4px rgba(29, 78, 216, 0.25);
}
.xm-scene-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  background: #64748b;
}
.xm-scene-chip.active .xm-scene-dot {
  background: #ffffff !important;
}
.xm-iso-chip {
  font-size: 0.8rem;
  padding: 2px 9px;
}
.xm-preset-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.xm-btn {
  font-family: inherit;
  font-size: 0.92rem;
  padding: 4px 9px;
  border-radius: 7px;
  border: 1px solid var(--ui-border);
  background: #ffffff;
  color: var(--ui-ink);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
}
.xm-btn:hover { background: #eef2ff; border-color: #93c5fd; }
.xm-btn:focus-visible,
.xm-row select:focus-visible,
.xm-row input:focus-visible {
  outline: 2px solid var(--ui-accent);
  outline-offset: 1px;
}
.xm-btn.active {
  background: #1d4ed8;
  color: #ffffff;
  border-color: #1d4ed8;
}
.xm-canvas-wrap {
  position: relative;
  flex: 1;
  min-height: 440px;
  display: flex;
  align-items: stretch;
}
canvas#xm-canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
}
canvas#xm-canvas:active { cursor: grabbing; }
.xm-hint {
  position: absolute;
  right: 10px;
  bottom: 8px;
  font-size: 0.84rem;
  padding: 3px 9px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.84);
  color: #374151;
  border: 1px solid rgba(22, 24, 29, 0.08);
  pointer-events: none;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.xm-hint.dark {
  background: rgba(24, 26, 31, 0.84);
  color: #e5e7eb;
  border-color: rgba(255, 255, 255, 0.14);
}
.xm-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 12px;
  border-top: 1px solid var(--ui-border);
  background: #fbfcfe;
  align-items: center;
}
.xm-status {
  margin-left: auto;
  font-size: 0.9rem;
  color: var(--ui-accent);
}
.xm-panel {
  background: var(--ui-card);
  border: 1px solid var(--ui-border);
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(22, 24, 29, 0.04);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 11px;
  overflow-y: auto;
  max-height: 760px;
}
.xm-checks {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 5px 10px;
  margin: 6px 0;
  font-size: 0.92rem;
}
.xm-checks label {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.xm-group {
  border-bottom: 1px dashed #e2e6ef;
  padding-bottom: 9px;
}
.xm-group:last-child { border-bottom: none; padding-bottom: 0; }
.xm-group-title {
  font-size: 1.02rem;
  font-weight: 700;
  margin-bottom: 6px;
}
.xm-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 5px;
  font-size: 0.94rem;
}
.xm-row select,
.xm-row input[type="number"] {
  font-family: inherit;
  font-size: 0.92rem;
  padding: 3px 6px;
  border: 1px solid var(--ui-border);
  border-radius: 6px;
  background: #ffffff;
}
.xm-row input[type="range"] { flex: 1; max-width: 155px; }
.xm-supercell {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.xm-supercell label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.9rem;
  border: 1px solid var(--ui-border);
  border-radius: 6px;
  padding: 3px 6px;
}
.xm-supercell input {
  width: 42px;
  border: none;
  font-family: inherit;
  font-size: 0.95rem;
  text-align: center;
}
.xm-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.xm-swatch {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 7px;
  border: 1px solid var(--ui-border);
  border-radius: 999px;
  background: #ffffff;
  font-size: 0.9rem;
}
.xm-swatch input[type="color"] {
  width: 22px;
  height: 22px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
}
.xm-codebox {
  width: 100%;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.74rem;
  padding: 6px;
  border-radius: 6px;
  border: 1px solid var(--ui-border);
  background: #f8fafc;
  resize: vertical;
  min-height: 76px;
}
</style>
</head>

          <div class="xm-title" id="xm-struct-title">xkcd-matchem 3D Studio</div>
          <span class="xm-cat-badge" id="xm-struct-category" style="display:none;"></span>
