      for (const s of symbols) if (!seen.includes(s)) seen.push(s);
      const step = Math.min(72, Math.max(46, (w - 40) / Math.max(seen.length, 1)));
      const startX = w * 0.5 - ((seen.length - 1) * step) * 0.5;
      const ly = h - 18;
      seen.forEach((sym, i) => {
        const lx = startX + i * step;
        parts.push(`<circle cx="${(lx - 10).toFixed(1)}" cy="${ly.toFixed(1)}" r="7" fill="${elementColor(sym)}" stroke="${ink}" stroke-width="1.25"/>`);
        parts.push(`<text x="${(lx + 2).toFixed(1)}" y="${(ly + 1).toFixed(1)}" fill="${ink}" font-family="__XM_FONT_FAMILY__, sans-serif" font-size="15" dominant-baseline="central">${sym}</text>`);
      });
    }
    parts.push("</svg>");
    return parts.join("\n");
  }

  function parseCifUncertainty(val) {
    return parseFloat(String(val || "").replace(/\([^)]*\)/g, ""));
  }

  function parseCifUploaded(name, text) {
    const clean = text.replace(/^\s*#.*$/gm, " ");
    const tokens = [];
    const rx = /'([^']*)'|"([^"]*)"|(\S+)/g;
    let m;
    while ((m = rx.exec(clean)) !== null) tokens.push(m[1] ?? m[2] ?? m[3]);
    const scalars = {};
    const loops = [];
    let i = 0;
    while (i < tokens.length) {
      const low = tokens[i].toLowerCase();
      if (low === "loop_") {
        i++;
        const hdr = [];
        while (i < tokens.length && tokens[i].startsWith("_")) hdr.push(tokens[i++].toLowerCase());
        const rows = [];
        while (i < tokens.length && tokens[i].toLowerCase() !== "loop_" && !tokens[i].startsWith("_") && !tokens[i].toLowerCase().startsWith("data_")) {
          if (hdr.length === 0 || i + hdr.length > tokens.length) { i++; continue; }
          rows.push(tokens.slice(i, i + hdr.length));
          i += hdr.length;
        }
        loops.push([hdr, rows]);
      } else if (tokens[i].startsWith("_") && i + 1 < tokens.length) {
        scalars[low] = tokens[i + 1];
        i += 2;
      } else { i++; }
    }
    const a = parseCifUncertainty(scalars["_cell_length_a"]);
    const b = parseCifUncertainty(scalars["_cell_length_b"]);
    const c = parseCifUncertainty(scalars["_cell_length_c"]);
    const al = (parseCifUncertainty(scalars["_cell_angle_alpha"] || "90") * Math.PI) / 180;
    const be = (parseCifUncertainty(scalars["_cell_angle_beta"] || "90") * Math.PI) / 180;
    const ga = (parseCifUncertainty(scalars["_cell_angle_gamma"] || "90") * Math.PI) / 180;
    const sinGa = Math.max(Math.sin(ga), 1e-12);
    const cx = c * Math.cos(be);
    const cy = (c * (Math.cos(al) - Math.cos(be) * Math.cos(ga))) / sinGa;
    const cz = Math.sqrt(Math.max(0, c * c - cx * cx - cy * cy));
    const cell = [[a, 0, 0], [b * Math.cos(ga), b * sinGa, 0], [cx, cy, cz]];
    const syms = [], pos = [];
    for (const [hdr, rows] of loops) {
      const ix = hdr.indexOf("_atom_site_fract_x"), iy = hdr.indexOf("_atom_site_fract_y"), iz = hdr.indexOf("_atom_site_fract_z");
      if (ix < 0 || iy < 0 || iz < 0) continue;
      const it = hdr.indexOf("_atom_site_type_symbol"), il = hdr.indexOf("_atom_site_label");
      for (const r of rows) {
        const rawSym = it >= 0 ? r[it] : (il >= 0 ? r[il] : "X");
        const symMatch = rawSym.match(/^[A-Za-z]{1,2}/);
        syms.push(symMatch ? symMatch[0][0].toUpperCase() + symMatch[0].slice(1).toLowerCase() : "X");
        const fr = [parseCifUncertainty(r[ix]), parseCifUncertainty(r[iy]), parseCifUncertainty(r[iz])];
        pos.push(matVec3T(cell, fr));
      }
    }
    if (!syms.length || !Number.isFinite(a)) throw new Error("Could not extract CIF unit cell and fractional sites.");
    return { name, symbols: syms, positions: pos, cell, pbc: [true, true, true], bonds: [] };
  }

  function parseUploadedFile(name, text) {
    const low = name.toLowerCase();
    const lines = text.replace(/\r/g, "").split("\n");
    if (low.endsWith(".xyz")) {
      const n = parseInt(lines[0].trim(), 10);
      const syms = [], pos = [];
      for (let i = 2; i < 2 + n && i < lines.length; i++) {
        const p = lines[i].trim().split(/\s+/);
        if (p.length >= 4) { syms.push(p[0]); pos.push([+p[1], +p[2], +p[3]]); }
      }
      return { name, symbols: syms, positions: pos, cell: null, pbc: [false, false, false], bonds: [] };
    }
    if (low.endsWith(".poscar") || low.endsWith(".vasp") || low === "poscar" || low === "contcar") {
      let scale = parseFloat(lines[1].trim());
      const cell = [2, 3, 4].map((idx) => lines[idx].trim().split(/\s+/).slice(0, 3).map(Number));
      const det = Math.abs(cell[0][0]*(cell[1][1]*cell[2][2]-cell[1][2]*cell[2][1]) - cell[0][1]*(cell[1][0]*cell[2][2]-cell[1][2]*cell[2][0]) + cell[0][2]*(cell[1][0]*cell[2][1]-cell[1][1]*cell[2][0]));
      if (scale < 0) scale = Math.cbrt((-scale) / det);
      const lat = cell.map((r) => r.map((v) => v * scale));
      const elems = lines[5].trim().split(/\s+/);
      const counts = lines[6].trim().split(/\s+/).map(Number);
      let cur = 7;
      if (lines[cur].trim()[0].toLowerCase() === "s") cur++;
      const mode = lines[cur++].trim()[0].toLowerCase();
      const syms = [], pos = [];
      elems.forEach((el, ei) => {
        for (let k = 0; k < counts[ei]; k++) {
          const vals = lines[cur++].trim().split(/\s+/).slice(0, 3).map(Number);
          syms.push(el);
          if (mode === "d") pos.push(matVec3T(lat, vals));
          else pos.push(vals.map((v) => v * scale));
        }
      });
      return { name, symbols: syms, positions: pos, cell: lat, pbc: [true, true, true], bonds: [] };
    }
    if (low.endsWith(".sdf") || low.endsWith(".mol")) {
      const cLine = lines[3];
      const na = parseInt(cLine.slice(0, 3).trim(), 10);
      const nb = parseInt(cLine.slice(3, 6).trim(), 10);
      const syms = [], pos = [], bonds = [];
      for (let i = 0; i < na; i++) {
        const l = lines[4 + i];
        pos.push([parseFloat(l.slice(0, 10)), parseFloat(l.slice(10, 20)), parseFloat(l.slice(20, 30))]);
        syms.push(l.slice(31, 34).trim());
      }
      for (let b = 0; b < nb; b++) {
        const l = lines[4 + na + b];
        bonds.push([parseInt(l.slice(0, 3), 10) - 1, parseInt(l.slice(3, 6), 10) - 1, parseInt(l.slice(6, 9), 10) || 1, [0, 0, 0]]);
      }
      return { name, symbols: syms, positions: pos, cell: null, pbc: [false, false, false], bonds };
    }
    if (low.endsWith(".pdb")) {
      const syms = [], pos = [];
      for (const l of lines) {
        if (l.startsWith("ATOM") || l.startsWith("HETATM")) {
          pos.push([parseFloat(l.slice(30, 38)), parseFloat(l.slice(38, 46)), parseFloat(l.slice(46, 54))]);
          const el = l.slice(76, 78).trim() || l.slice(12, 16).trim().replace(/[^A-Za-z]/g, "").slice(0, 1);
          syms.push(el);
        }
      }
      return { name, symbols: syms, positions: pos, cell: null, pbc: [false, false, false], bonds: [] };
    }
    if (low.endsWith(".cif")) {
      return parseCifUploaded(name, text);
    }
    throw new Error("Supported browser formats: .xyz, .poscar/.vasp, .cif, .sdf/.mol, .pdb");
  }

  // Event wiring
  let dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener("pointerdown", (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (e.shiftKey) state.roll += dx * 0.45;
    else {
      state.azimuth -= dx * 0.55;
      state.elevation = Math.max(-89.9, Math.min(89.9, state.elevation + dy * 0.45));
    }
    renderFrame();
  });
  canvas.addEventListener("pointerup", () => { dragging = false; });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    state.zoom = Math.max(0.4, Math.min(3.0, state.zoom * (e.deltaY < 0 ? 1.07 : 0.93)));
    document.getElementById("xm-zoom").value = state.zoom.toFixed(2);
    document.getElementById("xm-zoom-val").textContent = state.zoom.toFixed(2);
    renderFrame();
  }, { passive: false });

  function stopPlayback() {
    if (playTimer !== null) {
      clearInterval(playTimer);
      playTimer = null;
    }
    state.playing = false;
    document.getElementById("xm-traj-play").textContent = "Play";
  }

  function applyTrajectoryFrame(idx) {
    const frames = currentSample.frames;
    if (!frames || !frames.length) return;
    const n = frames.length;
    const fIdx = ((idx % n) + n) % n;
    state.frameIdx = fIdx;
    const fr = frames[fIdx];
    baseData.positions = fr.positions.map((p) => p.slice());
    if (fr.cell) baseData.cell = fr.cell.map((r) => r.slice());
    if (fr.bonds) baseData.bonds = fr.bonds;
    if (fr.vectors) baseData.vectors = fr.vectors;
    document.getElementById("xm-traj-slider").value = String(fIdx);
    const eStr = fr.energy !== undefined ? ` | E=${Number(fr.energy).toFixed(3)} eV` : "";
    document.getElementById("xm-traj-readout").textContent = `Frame ${fIdx + 1} / ${n}${eStr}`;
    renderFrame();
  }

  function syncTrajectoryControls() {
    stopPlayback();
    const grp = document.getElementById("xm-traj-group");
    const frames = currentSample.frames;
    if (frames && frames.length > 1) {
      grp.style.display = "block";
      const slider = document.getElementById("xm-traj-slider");
      slider.max = String(frames.length - 1);
      slider.value = "0";
      applyTrajectoryFrame(0);
    } else {
      grp.style.display = "none";
    }
  }

  document.getElementById("xm-traj-slider").addEventListener("input", (e) => {
    stopPlayback();
    applyTrajectoryFrame(parseInt(e.target.value, 10) || 0);
  });
  document.getElementById("xm-traj-play").addEventListener("click", () => {
    const frames = currentSample.frames;
    if (!frames || frames.length <= 1) return;
    if (state.playing) { stopPlayback(); return; }
    state.playing = true;
    document.getElementById("xm-traj-play").textContent = "Pause";
    playTimer = setInterval(() => {
      applyTrajectoryFrame(state.frameIdx + 1);
    }, Math.max(40, Math.round(1000 / Math.max(state.fps, 1))));
  });
  document.getElementById("xm-traj-fps").addEventListener("change", (e) => {
    state.fps = parseInt(e.target.value, 10) || 8;
    if (state.playing) {
      stopPlayback();
      document.getElementById("xm-traj-play").click();

  function applySampleState(smp, isUpload) {
    currentSample = smp;
    baseData = cloneStruct(smp);
    const cam = smp.camera || {};
    state.azimuth = cam.azimuth ?? -118;
    state.elevation = cam.elevation ?? 24;
    state.roll = cam.roll ?? 0;
    state.perspective = cam.perspective ?? 0;
    state.zoom = cam.zoom ?? 1.0;
    state.supercell = [1, 1, 1];
    state.customColors = Object.assign({}, smp.custom_colors || {});
    if (smp.style) {
      state.style = smp.style;
    } else if (isUpload && !smp.cell && state.style === "polyhedra") {
      state.style = "ball_and_stick";
    }
    if (smp.palette_name) state.palette = smp.palette_name;
    if (smp.show_cell !== undefined) {
      state.cellMode = resolveInitialCellMode(smp.show_cell);
      state.axesMode = resolveInitialAxesMode(smp.show_cell);
    }
    if (smp.isosurfaces && smp.isosurfaces.length) {
      state.showIso = true;
    }
    state.isoShade = smp.iso_shade || "solid";
    document.querySelectorAll("#xm-view-buttons .xm-btn").forEach((b) => {
      b.classList.remove("active");
    });
    syncControlInputs();
    syncTrajectoryControls();
    renderFrame();
  }

    const cam = currentSample.camera || {};
    state.azimuth = cam.azimuth ?? -118;
    state.elevation = cam.elevation ?? 24;
    state.roll = cam.roll ?? 0;
    state.perspective = cam.perspective ?? 0;
    state.zoom = cam.zoom ?? 1.0;
    document.querySelectorAll("#xm-view-buttons .xm-btn").forEach((b) => {
      b.classList.remove("active");

    syncControlInputs();
    renderFrame();

  window.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
    if (tag === "input" || tag === "select" || tag === "textarea") return;
    if (e.key === "r" || e.key === "R") {
      document.getElementById("xm-reset-view").click();
    } else if (e.key === " " && currentSample.frames && currentSample.frames.length > 1) {
      e.preventDefault();
      document.getElementById("xm-traj-play").click();

  });

  function sceneChipLabel(smp, idx) {
    const raw = (typeof smp.short_name === "string" && smp.short_name.trim())
      ? smp.short_name.trim()
      : String(smp.name || `Sample ${idx + 1}`).trim();
    const cleaned = raw.replace(/\s+\([^()]*\.[a-zA-Z0-9]{2,8}\)$/, "").trim();
    return cleaned || raw || `Sample ${idx + 1}`;
  }

  function sceneCategoryColor(smp) {
    const cat = typeof smp.category === "string" ? smp.category.toLowerCase() : "";
    if (cat.includes("orbital") || cat.includes("iso") || (smp.isosurfaces && smp.isosurfaces.length)) {
      return "#0072B2";
    }
    if (cat.includes("reaction") || cat.includes("md") || cat.includes("traj") || (smp.frames && smp.frames.length > 1)) {
      return "#D55E00";
    }
    if (cat.includes("bio")) return "#E69F00";
    if (cat.includes("crystal") || cat.includes("slab") || cat.includes("poly") || smp.cell) {
      return "#009E73";
    }
    if (cat.includes("mol")) return "#CC79A7";
    return "#64748b";
  }

  function syncSceneChips(activeIdx) {
    document.querySelectorAll("#xm-scene-chips .xm-scene-chip").forEach((chip) => {
      const isAct = Number(chip.dataset.sampleIndex) === activeIdx;
      chip.classList.toggle("active", isAct);
      chip.setAttribute("aria-pressed", isAct ? "true" : "false");
    });
  }

  function selectSampleByIndex(idx) {
    if (!Number.isInteger(idx) || idx < 0 || idx >= samples.length) return;
    const sel = document.getElementById("xm-sample-select");
    if (sel && sel.value !== String(idx)) sel.value = String(idx);
    syncSceneChips(idx);
    applySampleState(samples[idx], false);

    if (chipWrap) chipWrap.textContent = "";
    samples.forEach((smp, i) => {
      const opt = document.createElement("option");

      const optCat = typeof smp.category === "string" && smp.category.trim()
        ? `[${smp.category.trim()}] `
        : "";
      opt.textContent = `${optCat}${smp.name || `Sample ${i + 1}`}`;
      sel.appendChild(opt);

      if (chipWrap) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "xm-scene-chip";
        chip.dataset.sampleIndex = String(i);

    const link = document.createElement("a");
    link.download = `${(currentSample.name || "structure").replace(/[^a-zA-Z0-9_-]/g, "_")}.svg`;
    link.href = URL.createObjectURL(blob);
    link.click();
  });

  window.addEventListener("resize", renderFrame);
  syncTrajectoryControls();
  renderFrame();
})();
</script>
</body>
</html>
