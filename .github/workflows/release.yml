name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2"
          python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install package with dev, animation, and twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,animation]" "twine>=5.0"

      - name: Run Ruff lint check
        run: ruff check .

      - name: Run Pylint on source package
        run: pylint src/xkcd_matchem

      - name: Run Mypy type check
        run: mypy src/xkcd_matchem

      - name: Run test suite with coverage gate
        run: pytest -v --cov=xkcd_matchem --cov-fail-under=90 tests/

      - name: Verify distributions with twine
        run: twine check dist/*

      - name: Verify release tag matches package and wheel version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import zipfile

          import xkcd_matchem as xm

          tag = os.environ["TAG_NAME"]
          expected = tag.removeprefix("v")
          pkg_version = xm.__version__
          assert pkg_version == expected, (
              f"Release tag {tag!r} does not match "
              f"xkcd_matchem.__version__ == {pkg_version!r}"
          )
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"Expected 1 wheel in dist/, got {wheels}"
          with zipfile.ZipFile(wheels[0]) as zf:
              meta_files = [
                  name for name in zf.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              assert len(meta_files) == 1, meta_files
              metadata = zf.read(meta_files[0]).decode("utf-8")
          assert f"Version: {expected}\n" in metadata, (
              f"Wheel METADATA version does not match {expected!r}"
          )
          print(f"Verified tag {tag} matches package & wheel {pkg_version}.")
          PY

      - name: Verify built wheel in fresh isolated temp venv
        env:
          MPLBACKEND: Agg
        run: |
          WHEEL_PATH="$(realpath dist/*.whl)"
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          python -m venv "$SMOKE_DIR/venv"
          "$SMOKE_DIR/venv/bin/python" -m pip install --upgrade pip
          "$SMOKE_DIR/venv/bin/python" -m pip install "$WHEEL_PATH"
          cd /tmp
          "$SMOKE_DIR/venv/bin/xkcd-matchem" --version
          "$SMOKE_DIR/venv/bin/xkcd-matchem" render si_diamond.cif \
            -o "$SMOKE_DIR/release_smoke.png"
          test -s "$SMOKE_DIR/release_smoke.png"
          "$SMOKE_DIR/venv/bin/python" - <<'PY'
          import importlib.resources
          import pathlib
          import tempfile
          import matplotlib
          matplotlib.use("Agg")
          from matplotlib import pyplot as plt
          import xkcd_matchem as xm
          from xkcd_matchem.style import fonts
          from xkcd_matchem.style import theme

          assert theme.get_preset("classic").font == "Patrick Hand"
          for name in ("Patrick Hand", "Comic Neue", "Comic Neue Bold"):
              assert fonts.get_bundled_font_path(name).is_file()
          fonts_dir = importlib.resources.files("xkcd_matchem.data").joinpath(
              "fonts"
          )
          for lic in ("PatrickHand-OFL.txt", "ComicNeue-OFL.txt"):
              assert fonts_dir.joinpath(lic).is_file()
          tpl = importlib.resources.files("xkcd_matchem.data").joinpath(
              "templates/viewer.html"
          )
          assert tpl.is_file()
          samples = xm.list_samples()
          assert len(samples) >= 16
          assert "si_diamond.cif" in samples

          with tempfile.TemporaryDirectory() as tmp:
              out_png = pathlib.Path(tmp) / "smoke.png"
              out_html = pathlib.Path(tmp) / "smoke.html"
              ax = xm.plot_crystal("si_diamond.cif")
              ax.figure.savefig(out_png)
              plt.close(ax.figure)
              assert out_png.is_file() and out_png.stat().st_size > 1000
              xm.export_interactive_html("aspirin.xyz", out_html)
              html_txt = out_html.read_text(encoding="utf-8")
              assert "Patrick Hand" in html_txt
              assert "__XM_PAYLOAD__" not in html_txt
          print("Release wheel verification passed.")
          PY

  publish:
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
